<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,initial-scale=1"><title>Webcam frame</title><link href="assets/fonts.css" rel="stylesheet"><style>
:root{--pink:#FF2E88;--orange:#FF8A3D;--purple:#6B2FD6;--cyan:#22E3E3;--ink:#0B0B14;--cream:#FFF5EC;--display:'Bebas Neue',sans-serif;--body:Inter,sans-serif;--slow:12s;--fast:500ms;--pink-glow:color-mix(in srgb,var(--pink) 47%,transparent);--pink-strong:color-mix(in srgb,var(--pink) 53%,transparent)}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
.frame{position:absolute;left:var(--x,70%);top:var(--y,8%);width:var(--w,27%);aspect-ratio:16/9;filter:drop-shadow(0 0 13px var(--pink-glow))}
.ring{position:absolute;inset:0;padding:6px;border-radius:12px;background:conic-gradient(from var(--angle,0deg),var(--pink),var(--orange),var(--purple),var(--cyan),var(--pink));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 12s linear infinite}
.inner{position:absolute;inset:10px;border:1px solid #fff5ec55;border-radius:5px}
.corner{position:absolute;width:34px;height:34px;border-color:var(--cyan);border-style:solid}
.a{top:-4px;left:-4px;border-width:3px 0 0 3px}.b{top:-4px;right:-4px;border-width:3px 3px 0 0}.c{bottom:-4px;left:-4px;border-width:0 0 3px 3px}.d{bottom:-4px;right:-4px;border-width:0 3px 3px 0}
.stripes{position:absolute;top:-3px;left:12%;width:16%;height:10px;background:repeating-linear-gradient(-60deg,var(--pink) 0 6px,transparent 6px 12px)}
.block{position:absolute;top:-3px;right:10%;width:18%;height:10px;background:linear-gradient(90deg,var(--purple),var(--cyan));clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.palms{position:absolute;left:-4%;bottom:-3%;height:42%;fill:#1d0b2b;filter:drop-shadow(0 0 6px var(--pink-strong))}
.skyline{position:absolute;right:2%;bottom:6px;height:22%;width:34%;fill:#1d0b2b}
.skyline .win{fill:var(--cyan);opacity:.7}
.tag{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%) skewX(-14deg);padding:7px 30px;border:2px solid transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,linear-gradient(90deg,var(--pink),var(--orange),var(--cyan)) border-box;box-shadow:0 0 18px var(--pink-strong)}
.tag span{display:block;transform:skewX(14deg);color:var(--cream);font:24px var(--display);letter-spacing:.14em;white-space:nowrap}
@keyframes spin{to{--angle:360deg}}
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}
@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style></head><body><div class="frame" id="frame"><div class="ring"></div><div class="inner"></div>
<i class="corner a"></i><i class="corner b"></i><i class="corner c"></i><i class="corner d"></i><i class="stripes"></i><i class="block"></i>
<svg class="skyline" viewBox="0 0 300 80" preserveAspectRatio="xMaxYMax meet"><path d="M0 80V52h18V38h14v42zm36 0V24h20v-8h8v8h8v56zm40 0V44h22v36zm26 0V8h10V0h4v8h10v72zm28 0V34h24v46zm28 0V18h18v62zm22 0V46h26v34zm30 0V28h12V14h6v14h12v52zm34 0V50h22v30z"/><path class="win" d="M40 30h4v3h-4zm8 0h4v3h-4zm-8 10h4v3h-4zm16 0h4v3h-4zm52-24h4v3h-4zm8 10h4v3h-4zm-8 12h4v3h-4zm8 10h4v3h-4zm60-20h4v3h-4zm6 10h4v3h-4zm-6 12h4v3h-4zm56-14h4v3h-4zm8 10h4v3h-4z"/></svg>
<svg class="palms" viewBox="0 0 160 200"><g transform="translate(40 0)"><path d="M57 200c5-48 9-94 2-128l7-2c8 37 4 83-1 130z"/><path d="M62 70C46 40 20 32 2 42c22-3 41 6 56 28zM62 70C52 38 59 14 74 2c-6 20-5 43-8 66zM64 70c18-27 40-32 56-24-20 0-38 9-52 26zM61 72C36 64 15 76 7 97c14-14 32-21 52-23zM65 72c24-5 42 7 48 28-12-14-28-21-46-25z"/></g><g transform="translate(0 70) scale(.65)"><path d="M57 200c5-48 9-94 2-128l7-2c8 37 4 83-1 130z"/><path d="M62 70C46 40 20 32 2 42c22-3 41 6 56 28zM62 70C52 38 59 14 74 2c-6 20-5 43-8 66zM64 70c18-27 40-32 56-24-20 0-38 9-52 26zM61 72C36 64 15 76 7 97c14-14 32-21 52-23zM65 72c24-5 42 7 48 28-12-14-28-21-46-25z"/></g></svg>
<div class="tag"><span id="name">SEU NOME AQUI</span></div></div><script>
const q=new URLSearchParams(location.search),f=document.querySelector('#frame');
for(const [p,v] of [['x','70%'],['y','8%'],['w','27%']])f.style.setProperty('--'+p,q.get(p)||v);
document.querySelector('#name').textContent=q.get('name')||'SEU NOME AQUI';
if(/^#?[0-9a-f]{3,8}$/i.test(q.get('color')||''))document.documentElement.style.setProperty('--pink','#'+q.get('color').replace('#',''));
</script></body></html>
