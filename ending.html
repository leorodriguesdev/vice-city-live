<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,initial-scale=1"><title>Ending</title><link href="assets/fonts.css" rel="stylesheet"><style>
:root{--pink:#FF2E88;--orange:#FF8A3D;--purple:#6B2FD6;--cyan:#22E3E3;--ink:#0B0B14;--cream:#FFF5EC;--gold:#F5C542;--display:'Bebas Neue',sans-serif;--body:Inter,sans-serif;--brush:Knewave,var(--display);--gta:GTA,var(--display);--slow:12s;--fast:500ms;--pink-glow:color-mix(in srgb,var(--pink) 47%,transparent);--pink-soft:color-mix(in srgb,var(--pink) 40%,transparent)}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:var(--cream);font-family:var(--body)}
.synth{position:absolute;inset:0}
body:not(.no-bg) .synth{display:none}
.no-bg .art,.no-bg .shade{display:none}
.sun{position:absolute;width:500px;height:500px;top:8%;left:50%;transform:translateX(-50%);border-radius:50%;overflow:hidden;background:linear-gradient(var(--orange),var(--pink),var(--purple));box-shadow:0 0 100px var(--pink-soft)}
.sun:after{content:"";position:absolute;inset:48% 0 0;background:repeating-linear-gradient(transparent 0 14px,#251039 15px 23px)}
.water{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(180deg,#22e3e322 0 2px,transparent 2px 19px);mask-image:linear-gradient(transparent,#000)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:drift 30s ease-in-out infinite alternate}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 50% 55% at 50% 48%,#0b0b14b3,#0b0b1466 60%,transparent),linear-gradient(transparent 65%,#0b0b14cc)}
.content{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%}
.mission{font:56px/1 var(--gta);letter-spacing:.02em;color:var(--gold);text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 6px 14px #0b0b14aa;animation:stamp 900ms cubic-bezier(.2,.8,.2,1) both}
h1{margin:18px 0 0;font-weight:400;line-height:.95;transform:rotate(-4deg)}
h1 span{display:block;font:140px/1 var(--brush);color:var(--cream);text-shadow:5px 5px 0 var(--ink),0 0 26px var(--pink-glow)}
h1 span:last-child{color:var(--pink);text-shadow:5px 5px 0 var(--ink),0 0 30px var(--pink-glow)}
.swash{display:block;width:700px;height:44px;margin:-4px auto 0;transform:rotate(-4deg)}
.swash .a{fill:var(--cyan)}.swash .b{fill:var(--pink)}
.socials{display:flex;justify-content:center;align-items:center;gap:0;margin-top:34px}
.social{display:flex;align-items:center;gap:12px;padding:6px 34px;font:30px var(--display);letter-spacing:.1em;text-shadow:0 2px 6px #0b0b14}
.social+.social{border-left:2px solid var(--pink)}
.social svg{width:40px;height:40px;fill:var(--cream);filter:drop-shadow(0 0 8px var(--pink-glow))}
.credits{position:absolute;bottom:6%;width:100%;text-align:center;font-size:14px;font-weight:800;letter-spacing:.4em;color:#fff5eccc;text-shadow:0 2px 6px #0b0b14;animation:rise 12s ease-in-out infinite}
.logo{position:absolute;top:40px;right:48px;width:220px;filter:drop-shadow(0 6px 18px #0b0b14aa)}
@keyframes rise{0%,100%{transform:translateY(8px);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes stamp{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.09) translateY(-1%)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style></head><body>
<div class="synth"><div class="sun"></div><div class="water"></div></div>
<img class="art" src="assets/img/bg-ending.webp" alt=""><div class="shade"></div>
<img class="logo" src="assets/img/logo-gta6.png" alt="Grand Theft Auto VI">
<section class="content"><div class="mission" id="mission">MISSÃO CUMPRIDA</div><h1 id="title"></h1>

<div class="socials">

<div class="social" id="yt"><svg viewBox="0 0 24 24"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.87.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg><span></span></div>
</div></section>
<div class="credits" id="credits">OBRIGADO POR ASSISTIR!</div>
<script>
const q=new URLSearchParams(location.search),get=(k,d)=>q.get(k)||d;
if(/^#?[0-9a-f]{3,8}$/i.test(q.get('color')||''))document.documentElement.style.setProperty('--pink','#'+q.get('color').replace('#',''));
if(q.get('bg')==='0')document.body.classList.add('no-bg');
const title=document.getElementById('title');
for(const text of get('title','VALEU,|ATÉ A PRÓXIMA!').split(/\||\n/)){const line=document.createElement('span');line.textContent=text;title.append(line)}
document.getElementById('mission').textContent=get('mission','MISSÃO CUMPRIDA');
document.getElementById('credits').textContent=get('credits','OBRIGADO POR ASSISTIR!');
for(const [id,label] of [['ig','INSTAGRAM'],['tiktok','TIKTOK'],['yt','YOUTUBE']]){
const social=document.getElementById(id);
if(q.get(id)==='-')social.remove();else social.querySelector('span').textContent=get(id,label);
}
</script></body></html>
